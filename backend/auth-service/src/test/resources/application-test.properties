# Test Profile Configuration
# Used by @ActiveProfiles("test") so the Spring context can load and run
# tests (e.g. contextLoads) without requiring a real PostgreSQL instance.

spring.datasource.url=jdbc:h2:mem:healthguard_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250655368566D5971
jwt.expiration=86400000
