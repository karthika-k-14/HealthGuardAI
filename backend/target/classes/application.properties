# ==============================================================
# HealthGuard AI Backend - Application Configuration
# ==============================================================

# Application
spring.application.name=healthguard-backend
server.port=${SERVER_PORT:8080}

# ------------------------------------------------------------
# Database (PostgreSQL) - credentials sourced from environment
# variables. Never hardcode real credentials here.
# ------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/healthguard
spring.datasource.username=postgres
spring.datasource.password=blue30@04
spring.jpa.hibernate.ddl-auto=update

# ------------------------------------------------------------
# JPA / Hibernate
# ------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ------------------------------------------------------------
# Logging
# ------------------------------------------------------------
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.com.healthguard=DEBUG

# ------------------------------------------------------------
# CORS (frontend origin) - used by CorsConfig
# ------------------------------------------------------------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ------------------------------------------------------------
# JWT - secret MUST be overridden via env var in real deployments.
# The default below is a dev-only fallback (256-bit, base64).
# ------------------------------------------------------------
app.jwt.secret=${JWT_SECRET:VGhpc0lzQURldk9ubHlEZWZhdWx0U2VjcmV0S2V5Rm9ySGVhbHRoR3VhcmRKV1RTaWduaW5nMjAyNg==}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
